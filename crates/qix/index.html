<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Qix</title>

    <!-- The `qix` binary, compiled to WebAssembly with its JavaScript glue. -->
    <link data-trunk rel="rust" data-bin="qix" data-wasm-opt="2" />

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #ccc;
            font-family: sans-serif;
        }

        /* eframe sizes the canvas to its parent. */
        #qix_canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loading_text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <canvas id="qix_canvas"></canvas>
    <p id="loading_text">Loading…</p>
</body>
</html>
