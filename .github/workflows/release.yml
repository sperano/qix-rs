name: Release

# Pushing a `v*` tag creates its GitHub release and attaches the desktop
# binaries (Linux, macOS, Windows) and the web build to it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A re-run keeps the release created by the first run.
      - name: Create the release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --verify-tag

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Install eframe and audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libgtk-3-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Players get the sound effects; without an audio device the game
      # plays silently.
      - name: Build
        run: cargo build --release --locked -p qix --features audio --target "$TARGET"

      - name: Package and upload
        shell: bash
        run: |
          name="qix-$TAG-$TARGET"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/qix.exe" "$name/"
            archive="$name.zip"
            7z a "$archive" "$name"
          else
            cp "target/$TARGET/release/qix" "$name/"
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          gh release upload "$TAG" "$archive" --repo "$GITHUB_REPOSITORY" --clobber

  web:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1

      # Trunk fetches the wasm-bindgen matching Cargo.lock and wasm-opt.
      - name: Build
        working-directory: crates/qix
        run: trunk build --release --locked

      - name: Package and upload
        run: |
          name="qix-$TAG-web"
          mv crates/qix/dist "$name"
          rm -f "$name/.trunk-lock"
          zip -r "$name.zip" "$name"
          gh release upload "$TAG" "$name.zip" --repo "$GITHUB_REPOSITORY" --clobber
